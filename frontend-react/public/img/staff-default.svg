  <path d="M66 40 Q70 38 74 40" stroke="#5b4a3a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="57" cy="45" r="2.2" fill="#1e293b"/>
  <circle cx="71" cy="45" r="2.2" fill="#1e293b"/>

  <!-- smile -->
