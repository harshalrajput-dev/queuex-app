<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Verification - QueueX</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .qx-verify-shell { max-width: 640px; margin: 0 auto; }
    .qx-verify-card {
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.94));
      color: var(--qx-ink);
      border-radius: var(--qx-radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: var(--qx-shadow-md);
      overflow: hidden;
    }
    .qx-verify-head {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 20px 24px;
      color: #fff;
      background: linear-gradient(130deg, #0a1533 0%, #0f1e4a 55%, #12306e 100%);
      border-bottom: 1px solid rgba(141, 173, 240, 0.25);
    }
    .qx-verify-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
    .qx-verify-brand small { display: block; font-size: 11.5px; font-weight: 600; opacity: 0.82; }
    .qx-verify-token { font-size: 24px; font-weight: 900; letter-spacing: 0.02em; }
    .qx-verify-body { padding: 24px; }
    .qx-verify-msg {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-radius: 12px;
      font-weight: 700; font-size: 14px;
      margin-bottom: 18px;
    }
    .qx-verify-msg.ok { background: rgba(16, 185, 129, 0.12); color: #065f46; border: 1px solid rgba(16, 185, 129, 0.4); }
    .qx-verify-msg.warn { background: rgba(245, 158, 11, 0.12); color: #92400e; border: 1px solid rgba(245, 158, 11, 0.45); }
    .qx-verify-msg.err { background: rgba(239, 68, 68, 0.1); color: #991b1b; border: 1px solid rgba(239, 68, 68, 0.4); }
    .qx-verify-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; margin-top: 6px; }
    .qx-verify-grid > div span { display: block; font-size: 11px; font-weight: 800; color: var(--qx-muted-ink); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
    .qx-verify-grid > div b { font-size: 14.5px; }
    .qx-verify-scan { display: flex; align-items: center; justify-content: center; margin: 20px 0; }
    @media print {
      body * { visibility: hidden; }
      .qx-verify-card, .qx-verify-card * { visibility: visible; }
      .qx-verify-card { position: absolute; top: 0; left: 0; width: 100%; box-shadow: none; border: 1px solid #cbd5e1; }
      .qx-print-hide { display: none !important; }
    }
  </style>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0052cc">
</head>
<body>
  <header class="qx-topbar">
    <div class="qx-topbar-inner">
      <a class="qx-brand" href="index.html">
        <span class="qx-brand-badge">🏥</span>
        <span class="qx-brand-text">QueueX <small>Token Verification</small></span>
      </a>
      <div class="spacer"></div>
      <div class="qx-nav-actions">
        <a href="queue-display.html" class="qx-btn qx-btn-outline qx-btn-sm">Live Queue</a>
        <a href="index.html" class="qx-btn qx-btn-outline qx-btn-sm">Home</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="qx-verify-shell" id="verifyBox" style="padding:28px 0;">
      <div class="qx-center">
        <div class="qx-spinner" style="margin:40px auto;"></div>
        <div class="qx-muted">Verifying token...</div>
      </div>
    </div>
  </main>

  <footer class="qx-footer">
    <div class="qx-footer-bottom">
      <div class="qx-footer-bottom-inner container">
        <span>© 2026 QueueX · Prototype for public hospital digital queue management</span>
        <span>⚠️ Not for emergencies — contact the hospital emergency desk immediately</span>
      </div>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/qrcode.min.js"></script>
  <script src="js/verify-token.js"></script>
</body>
</html>
